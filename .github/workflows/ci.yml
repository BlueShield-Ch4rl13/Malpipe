# CI — lint, tests, el portal del navegador en Chromium y escaneo de secretos.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # web + full: sin ellas, tests/test_webapp.py y tests/test_yara.py
          # se saltaban enteros y el CI salia verde sin probar el portal
          pip install -e ".[web,full,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        # El portal se prueba en su propio job (necesita Node y Chromium)
        run: pytest -q --ignore=tests/test_portal.py

  portal:
    name: Portal del navegador (Pyodide + YARA-X en Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Construir web/dist (lo mismo que hace Cloudflare)
        run: npm ci && npm run build

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias y Chromium
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Portal de extremo a extremo, con la CSP de produccion
        run: pytest -q tests/test_portal.py

  secret-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
