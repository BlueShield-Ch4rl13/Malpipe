# Actualizaciones de dependencias una vez al mes, agrupadas en un solo PR por
# ecosistema para que no se acumule ruido. El CI tiene que pasar antes de fusionar.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: monthly}
    groups: {python: {patterns: ["*"]}}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: monthly}
    groups: {portal: {patterns: ["*"]}}
